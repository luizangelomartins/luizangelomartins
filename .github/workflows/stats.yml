name: Atualizar Card de Atividade

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar card SVG estilo Vercel
        run: |
          USUARIO="luizangelomartins"

          DADOS=$(curl -s https://api.github.com/users/$USUARIO)
          EVENTOS=$(curl -s https://api.github.com/users/$USUARIO/events/public)

          REPOS=$(echo "$DADOS" | jq '.public_repos')

          PUSHES=$(echo "$EVENTOS" | jq '[.[] | select(.type=="PushEvent")] | length')
          FORKS=$(echo "$EVENTOS" | jq '[.[] | select(.type=="ForkEvent")] | length')
          CRIACOES=$(echo "$EVENTOS" | jq '[.[] | select(.type=="CreateEvent")] | length')

          echo "<svg width='600' height='240' xmlns='http://www.w3.org/2000/svg'>" > stats.svg

          # fundo estilo Vercel
          echo "<rect width='100%' height='100%' rx='12' fill='#0a0a0a'/>" >> stats.svg

          # título
          echo "<text x='25' y='45' fill='#ffffff' font-size='20' font-weight='bold'>📊 Painel de Atividade</text>" >> stats.svg
          echo "<text x='25' y='70' fill='#888' font-size='12'>Atualizado automaticamente via GitHub Actions</text>" >> stats.svg

          # separador
          echo "<line x1='25' y1='85' x2='575' y2='85' stroke='#222'/>" >> stats.svg

          # métricas
          echo "<text x='25' y='120' fill='#58a6ff' font-size='16'>📦 Repositórios: $REPOS</text>" >> stats.svg
          echo "<text x='25' y='150' fill='#7ee787' font-size='16'>⚡ Pushes recentes: $PUSHES</text>" >> stats.svg
          echo "<text x='25' y='180' fill='#f1c40f' font-size='16'>🔁 Forks: $FORKS</text>" >> stats.svg
          echo "<text x='25' y='210' fill='#ff6b6b' font-size='16'>🧱 Criações: $CRIACOES</text>" >> stats.svg

          echo "</svg>" >> stats.svg

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stats.svg
          git commit -m "atualiza card de atividade" || exit 0
          git push
