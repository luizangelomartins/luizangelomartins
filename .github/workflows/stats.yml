name: Atualizar Card de Atividade

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar stats SVG
        run: |
          mkdir -p SVG

          USUARIO="luizangelomartins"

          DADOS=$(curl -s https://api.github.com/users/$USUARIO)
          EVENTOS=$(curl -s https://api.github.com/users/$USUARIO/events/public)

          REPOS=$(echo "$DADOS" | jq '.public_repos')
          PUSHES=$(echo "$EVENTOS" | jq '[.[] | select(.type=="PushEvent")] | length')
          FORKS=$(echo "$EVENTOS" | jq '[.[] | select(.type=="ForkEvent")] | length')
          ISSUES=$(echo "$EVENTOS" | jq '[.[] | select(.type=="IssuesEvent")] | length')

          printf "<svg width='600' height='260' xmlns='http://www.w3.org/2000/svg'>" > SVG/stats.svg
          printf "<rect width='100%%' height='100%%' rx='14' fill='#0d1117'/>" >> SVG/stats.svg

          printf "<text x='25' y='40' fill='#ffffff' font-size='20' font-weight='bold'>Painel de Atividade</text>" >> SVG/stats.svg
          printf "<text x='25' y='70' fill='#8b949e' font-size='12'>Atualizado via GitHub Actions</text>" >> SVG/stats.svg

          printf "<line x1='25' y1='85' x2='575' y2='85' stroke='#21262d'/>" >> SVG/stats.svg

          printf "<text x='25' y='120' fill='#58a6ff' font-size='16'>Repositórios: %s</text>" "$REPOS" >> SVG/stats.svg
          printf "<text x='25' y='150' fill='#7ee787' font-size='16'>Pushes: %s</text>" "$PUSHES" >> SVG/stats.svg
          printf "<text x='25' y='180' fill='#f1c40f' font-size='16'>Forks: %s</text>" "$FORKS" >> SVG/stats.svg
          printf "<text x='25' y='210' fill='#ff7b72' font-size='16'>Issues: %s</text>" "$ISSUES" >> SVG/stats.svg

          printf "<text x='25' y='240' fill='#8b949e' font-size='12'>Eventos públicos recentes</text>" >> SVG/stats.svg
          printf "</svg>" >> SVG/stats.svg

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add SVG/stats.svg
          git commit -m "update stats SVG" || exit 0
          git push
