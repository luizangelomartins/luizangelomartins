name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats SVG
        run: |
          USER="luizangelomartins"

          USER_DATA=$(curl -s https://api.github.com/users/$USER)
          EVENTS=$(curl -s https://api.github.com/users/$USER/events/public)

          REPOS=$(echo "$USER_DATA" | jq '.public_repos')

          COMMITS=$(echo "$EVENTS" | jq '[.[] | select(.type=="PushEvent")] | length')
          FORKS=$(echo "$EVENTS" | jq '[.[] | select(.type=="ForkEvent")] | length')
          CREATES=$(echo "$EVENTS" | jq '[.[] | select(.type=="CreateEvent")] | length')

          echo "<svg width='600' height='260' xmlns='http://www.w3.org/2000/svg'>" > stats.svg
          echo "<rect width='100%' height='100%' fill='#0d1117'/>" >> stats.svg

          echo "<text x='20' y='40' fill='#58a6ff' font-size='22' font-weight='bold'>GitHub Activity Dashboard</text>" >> stats.svg

          echo "<text x='20' y='90' fill='#c9d1d9' font-size='16'>📦 Repositories: $REPOS</text>" >> stats.svg
          echo "<text x='20' y='130' fill='#c9d1d9' font-size='16'>⚡ Push Events (recent): $COMMITS</text>" >> stats.svg
          echo "<text x='20' y='170' fill='#c9d1d9' font-size='16'>🔁 Forks: $FORKS</text>" >> stats.svg
          echo "<text x='20' y='210' fill='#c9d1d9' font-size='16'>🧱 Creates: $CREATES</text>" >> stats.svg

          echo "<text x='20' y='245' fill='#7ee787' font-size='14'>Auto-updated every 6 hours</text>" >> stats.svg

          echo "</svg>" >> stats.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stats.svg
          git commit -m "update profile stats" || exit 0
          git push
