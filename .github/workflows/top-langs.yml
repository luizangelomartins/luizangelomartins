name: Atualizar Linguagens Mais Usadas SVG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar SVG de linguagens (cards)
        run: |
          mkdir -p svg

          USUARIO="luizangelomartins"

          REPOS=$(curl -s https://api.github.com/users/$USUARIO/repos?per_page=100)

          echo "$REPOS" | jq -r '.[].languages_url' | while read url; do
            curl -s "$url"
          done | jq -s 'add' > langs.json

          if [ ! -s langs.json ]; then
            echo "{}" > langs.json
          fi

          TOTAL=$(jq 'to_entries | map(.value) | add' langs.json)

          # 🔥 apenas TOP 4
          jq -r 'to_entries | sort_by(.value) | reverse | .[0:4][] | "\(.key) \(.value)"' langs.json > top.txt

          # 🎨 cores por linguagem
          get_color() {
            case "$1" in
              JavaScript) echo "#f1e05a" ;;
              TypeScript) echo "#3178c6" ;;
              Python) echo "#3572A5" ;;
              Java) echo "#b07219" ;;
              HTML) echo "#e34c26" ;;
              CSS) echo "#563d7c" ;;
              PHP) echo "#4F5D95" ;;
              Go) echo "#00ADD8" ;;
              Ruby) echo "#701516" ;;
              Shell) echo "#89e051" ;;
              *) echo "#8b949e" ;;
            esac
          }

          # 📦 SVG base (mais compacto)
          printf "<svg width='620' height='220' xmlns='http://www.w3.org/2000/svg'>" > svg/langs.svg
          printf "<rect width='100%%' height='100%%' rx='18' fill='#0d1117'/>" >> svg/langs.svg

          # título
          printf "<text x='25' y='40' fill='#ffffff' font-size='24' font-weight='bold'>Top Linguagens</text>" >> svg/langs.svg
          printf "<text x='25' y='62' fill='#8b949e' font-size='12'>GitHub Stats auto-update</text>" >> svg/langs.svg

          CARD_W=135
          CARD_H=120
          START_X=25
          START_Y=80
          GAP=12

          i=0

          while read lang count; do
            PCT=$(awk "BEGIN {if ($TOTAL>0) printf \"%.1f\", ($count/$TOTAL)*100; else print 0}")
            COLOR=$(get_color "$lang")

            X=$((START_X + i * (CARD_W + GAP)))

            # card
            printf "<rect x='%s' y='%s' width='%s' height='%s' rx='14' fill='#161b22' stroke='#21262d'/>" \
              "$X" "$START_Y" "$CARD_W" "$CARD_H" >> svg/langs.svg

            # barra colorida
            printf "<rect x='%s' y='%s' width='6' height='%s' rx='3' fill='%s'/>" \
              "$X" "$START_Y" "$CARD_H" "$COLOR" >> svg/langs.svg

            # linguagem
            printf "<text x='%s' y='%s' fill='%s' font-size='14' font-weight='bold'>%s</text>" \
              $((X + 15)) $((START_Y + 45)) "$COLOR" "$lang" >> svg/langs.svg

            # porcentagem
            printf "<text x='%s' y='%s' fill='#8b949e' font-size='16'>%s%%</text>" \
              $((X + 15)) $((START_Y + 85)) "$PCT" >> svg/langs.svg

            i=$((i+1))
          done < top.txt

          printf "</svg>" >> svg/langs.svg

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add svg/langs.svg
          git commit -m "atualiza svg de linguagens (top 4)" || exit 0
          git push
