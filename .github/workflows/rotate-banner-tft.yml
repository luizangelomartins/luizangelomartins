name: Rotate Banners (TFT Images)

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout image-render-tft
        uses: actions/checkout@v4
        with:
          repository: luizangelomartins/image-render-tft
          token: ${{ secrets.GH_TOKEN_TFT }}
          path: image-render-tft
          fetch-depth: 0

      - name: Rotate banners
        working-directory: image-render-tft
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Lista as imagens em ordem, sem aleatoriedade
          mapfile -t FILES < <(
            find images -type f \( \
              -iname "*.png" -o \
              -iname "*.jpg" -o \
              -iname "*.jpeg" -o \
              -iname "*.webp" \
            \) | sort
          )

          # Garante que existem pelo menos 3 imagens
          if [ "${#FILES[@]}" -lt 3 ]; then
            echo "Erro: são necessárias pelo menos 3 imagens na pasta images/"
            exit 1
          fi

          TOTAL=${#FILES[@]}

          # Lê o índice salvo anteriormente
          if [ -f rotation_index.txt ]; then
            INDEX=$(cat rotation_index.txt)
          else
            INDEX=0
          fi

          # Corrige índice caso esteja fora do limite
          INDEX=$((INDEX % TOTAL))

          # Seleciona 3 imagens sequenciais, voltando ao início quando necessário
          FILE1="${FILES[$((INDEX % TOTAL))]}"
          FILE2="${FILES[$(((INDEX + 1) % TOTAL))]}"
          FILE3="${FILES[$(((INDEX + 2) % TOTAL))]}"

          echo "Imagens selecionadas:"
          echo "banner1.png = $FILE1"
          echo "banner2.png = $FILE2"
          echo "banner3.png = $FILE3"

          # Copia para os nomes fixos
          cp "$FILE1" docs/banner1.png
          cp "$FILE2" docs/banner2.png
          cp "$FILE3" docs/banner3.png

          # Próximo índice
          NEXT_INDEX=$(((INDEX + 3) % TOTAL))
          echo "$NEXT_INDEX" > rotation_index.txt

          # Estado atual
          {
            echo "banner1.png = $FILE1"
            echo "banner2.png = $FILE2"
            echo "banner3.png = $FILE3"
            echo "Current index: $INDEX"
            echo "Next index: $NEXT_INDEX"
            echo "Updated: $(date -u)"
          } > state.txt

          # Histórico
          {
            echo "$(date -u) | banner1.png | $FILE1"
            echo "$(date -u) | banner2.png | $FILE2"
            echo "$(date -u) | banner3.png | $FILE3"
          } >> history.txt

          git add docs/banner1.png \
                  docs/banner2.png \
                  docs/banner3.png \
                  rotation_index.txt \
                  state.txt \
                  history.txt

          # Evita commit vazio
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "rotate banners"

      - name: Push changes
        working-directory: image-render-tft
        run: |
          git push origin main
