name: Rotate Banners (TFT Images)

on:
  schedule:
    - cron: "0,25,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout image-render-tft
        uses: actions/checkout@v4
        with:
          repository: luizangelomartins/image-render-tft
          token: ${{ secrets.GH_TOKEN_TFT }}
          path: image-render-tft
          fetch-depth: 0

      - name: Rotate banners
        working-directory: image-render-tft
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Lista todas as imagens disponíveis e sorteia 3
          mapfile -t FILES < <(
            find images -type f \( \
              -iname "*.png" -o \
              -iname "*.jpg" -o \
              -iname "*.jpeg" -o \
              -iname "*.webp" \
            \) | shuf | head -n 3
          )

          # Garante que existem pelo menos 3 imagens
          if [ "${#FILES[@]}" -lt 3 ]; then
            echo "Erro: são necessárias pelo menos 3 imagens na pasta images/"
            exit 1
          fi

          echo "Imagens selecionadas:"
          printf '%s\n' "${FILES[@]}"

          # Copia para os nomes fixos
          cp "${FILES[0]}" docs/banner1.png
          cp "${FILES[1]}" docs/banner2.png
          cp "${FILES[2]}" docs/banner3.png

          # Registra quais foram usadas
          {
            echo "banner1.png = ${FILES[0]}"
            echo "banner2.png = ${FILES[1]}"
            echo "banner3.png = ${FILES[2]}"
            echo "Updated: $(date -u)"
          } > state.txt

          # Histórico
          {
            echo "$(date -u) | banner1.png | ${FILES[0]}"
            echo "$(date -u) | banner2.png | ${FILES[1]}"
            echo "$(date -u) | banner3.png | ${FILES[2]}"
          } >> history.txt

          git add docs/banner1.png \
                  docs/banner2.png \
                  docs/banner3.png \
                  state.txt \
                  history.txt

          # Evita commit vazio
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "rotate banners"

      - name: Push changes
        working-directory: image-render-tft
        run: |
          git push origin main
