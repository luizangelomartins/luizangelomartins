name: Rotate Banner (Steam Assets)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repo principal (só para rodar o workflow)
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_WRITE }}

      # 2. Clonar repo público de assets (ONDE FICA O BANNER)
      - name: Clone assets repo (photos-steam)
        run: |
          git clone https://x-access-token:${{ secrets.GH_WRITE }}@github.com/luizangelomartins/photos-steam.git
          cd photos-steam
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # 3. Garantir fila simples (lista de imagens)
      - name: Build image list
        run: |
          cd photos-steam

          find photos -type f > queue.txt
          shuf -o queue.txt queue.txt

      # 4. Selecionar próxima imagem
      - name: Pick next image
        run: |
          cd photos-steam

          FILE=$(head -n 1 queue.txt)

          echo "Selected: $FILE"

          # atualizar fila
          tail -n +2 queue.txt > tmp.txt
          mv tmp.txt queue.txt

          # atualizar state (força mudança real)
          echo "$FILE" > state.txt
          echo "$(date -u)" >> state.txt

          # atualizar banner
          cp "$FILE" banner.png

      # 5. Commit e push no repo correto (photos-steam)
      - name: Commit and push changes
        run: |
          cd photos-steam

          git add -A

          echo "=== STATUS ==="
          git status

          git commit -m "rotate banner" || echo "No changes to commit"

          git push
