name: Rotate Banner (Steam Assets)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Check token
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "ERROR: GH_TOKEN não disponível"
            exit 1
          fi

      - name: Clone private repo (images)
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/luizangelomartins/photos-steam.git

      - name: Clone public repo (banner)
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/luizangelomartins/assets-perfil-steam-photos.git

      - name: Pick random image and replace banner
        run: |
          cd photos-steam

          FILE=$(find photos -type f | shuf -n 1)

          echo "Selected: $FILE"

          cp "$FILE" ../assets-perfil-steam-photos/banner.png

      - name: Commit and push public repo
        run: |
          cd assets-perfil-steam-photos

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add banner.png
          git commit -m "rotate banner $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || exit 0

          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/luizangelomartins/assets-perfil-steam-photos.git HEAD:main
