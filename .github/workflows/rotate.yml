name: Rotate Banner (Steam Assets)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Clone photos-steam
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/luizangelomartins/photos-steam.git

      - name: Rotate banner
        run: |
          cd photos-steam

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          find photos -type f > queue.txt
          shuf -o queue.txt queue.txt

          FILE=$(head -n 1 queue.txt)

          echo "Selected: $FILE"

          tail -n +2 queue.txt > tmp.txt
          mv tmp.txt queue.txt

          echo "$FILE" > state.txt
          echo "$(date -u)" >> state.txt

          cp "$FILE" banner.png

          git add -A
          git commit -m "rotate banner" || echo "No changes"

      - name: Push changes
        run: |
          cd photos-steam

          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/luizangelomartins/photos-steam.git
          git push origin main
