name: Rotate Banner (Steam Assets)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_WRITE }}

      - name: Clone photos-steam (READ)
        run: |
          git clone https://x-access-token:${{ secrets.GH_READ }}@github.com/luizangelomartins/photos-steam.git

      - name: Configure and rotate
        run: |
          cd photos-steam

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # garante remote com token ANTES de qualquer operação
          git remote set-url origin https://x-access-token:${{ secrets.GH_WRITE }}@github.com/luizangelomartins/photos-steam.git

          # build queue
          find photos -type f > queue.txt
          shuf -o queue.txt queue.txt

          FILE=$(head -n 1 queue.txt)

          echo "Selected: $FILE"

          tail -n +2 queue.txt > tmp.txt
          mv tmp.txt queue.txt

          echo "$FILE" > state.txt
          echo "$(date -u)" >> state.txt

          cp "$FILE" banner.png

          git add -A

          git commit -m "rotate banner" || echo "No changes to commit"

          # push FORÇADO com remote já autenticado
          git push
