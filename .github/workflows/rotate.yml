name: Rotate Banner (Steam Assets)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout photos-steam
        uses: actions/checkout@v4
        with:
          repository: luizangelomartins/photos-steam
          token: ${{ secrets.GH_TOKEN }}
          path: photos-steam
          fetch-depth: 0

      - name: Rotate banner
        working-directory: photos-steam
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f queue.txt ]; then
            find photos -type f | shuf > queue.txt
          fi

          if [ ! -s queue.txt ]; then
            find photos -type f | shuf > queue.txt
          fi

          FILE=$(head -n 1 queue.txt)

          echo "Selected: $FILE"

          tail -n +2 queue.txt > queue.tmp || true
          mv queue.tmp queue.txt

          {
            echo "$FILE"
            date -u
          } > state.txt

          cp "$FILE" banner.png

          git add banner.png queue.txt state.txt

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "rotate banner"

      - name: Push changes
        working-directory: photos-steam
        run: |
          git push origin main

      - name: Trigger site deploy (webhook)
        if: success()
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
