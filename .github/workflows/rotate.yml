name: Rotate Steam Banner (No Repeat Queue)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório principal (com token correto)
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # 2. Clonar repositório privado de imagens
      - name: Clone private images repo
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/luizangelomartins/photos-steam.git

      # 3. Preparar estrutura local
      - name: Prepare assets folder
        run: |
          mkdir -p perfil-assets
          touch perfil-assets/state.txt
          touch perfil-assets/queue.txt

      # 4. Gerar fila se estiver vazia
      - name: Build queue if needed
        run: |
          if [ ! -s perfil-assets/queue.txt ]; then
            find photos-steam/photos -type f > perfil-assets/queue.txt
            shuf -o perfil-assets/queue.txt perfil-assets/queue.txt
          fi

      # 5. Pegar próxima imagem da fila
      - name: Pick next image
        run: |
          FILE=$(head -n 1 perfil-assets/queue.txt)

          echo "Selected: $FILE"

          # remove da fila
          tail -n +2 perfil-assets/queue.txt > perfil-assets/tmp.txt
          mv perfil-assets/tmp.txt perfil-assets/queue.txt

          # salva estado atual
          echo "$FILE" > perfil-assets/state.txt

          # copia como banner
          cp "$FILE" perfil-assets/banner.png

      # 6. Commit e push das mudanças
      - name: Commit assets
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add perfil-assets

          git commit -m "rotate banner queue" || echo "No changes to commit"

          git push
