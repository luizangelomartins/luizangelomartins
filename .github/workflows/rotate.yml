name: Rotate Banner (Steam Assets)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Check token
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "ERROR: GH_TOKEN não disponível"
            exit 1
          fi

      - name: Clone private photos repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/luizangelomartins/photos-steam.git

      - name: Clone public assets repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/luizangelomartins/assets-perfil-steam-photos.git

      - name: Rotate banner
        run: |
          CURRENT_HASH=$(sha256sum assets-perfil-steam-photos/banner.png | cut -d ' ' -f1)

          cd photos-steam

          find photos -type f > all.txt

          while true; do
            FILE=$(shuf -n 1 all.txt)

            NEW_HASH=$(sha256sum "$FILE" | cut -d ' ' -f1)

            if [ "$NEW_HASH" != "$CURRENT_HASH" ]; then
              break
            fi
          done

          echo "Selected: $FILE"

          cp "$FILE" ../assets-perfil-steam-photos/banner.png

      - name: Commit and push public repo
        run: |
          cd assets-perfil-steam-photos

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add banner.png
          git commit -m "rotate banner ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"

          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/luizangelomartins/assets-perfil-steam-photos.git

          git push origin main
