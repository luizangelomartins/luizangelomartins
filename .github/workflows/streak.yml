name: Atualizar Streak + Stats SVG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar SVG (layout dividido)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p svg

          USER="luizangelomartins"

          curl -s -H "Authorization: bearer $GH_TOKEN" \
            -X POST https://api.github.com/graphql \
            -d @- <<EOF > data.json
          {
            "query": "query { user(login: \"$USER\") { contributionsCollection { totalCommitContributions contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }"
          }
          EOF

          TOTAL=$(jq '.data.user.contributionsCollection.totalCommitContributions' data.json)

          # 🔥 streak
          STREAK=0
          while read DATE COUNT; do
            if [ "$COUNT" -gt 0 ]; then
              STREAK=$((STREAK+1))
            else
              break
            fi
          done < <(jq -r '.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | "\(.date) \(.contributionCount)"' data.json | sort -r)

          # 🎨 SVG lado a lado
          cat <<EOF > svg/streak.svg
          <svg width="600" height="180" xmlns="http://www.w3.org/2000/svg">
            
            <!-- fundo -->
            <rect width="100%" height="100%" rx="18" fill="#0d1117"/>

            <!-- linha divisória -->
            <line x1="300" y1="25" x2="300" y2="155" stroke="#30363d" stroke-width="2"/>

            <!-- LEFT: STREAK -->
            <text x="40" y="55" fill="#ffffff" font-size="20" font-weight="bold">
              🔥 Streak Atual
            </text>

            <text x="40" y="120" fill="#58a6ff" font-size="44" font-weight="bold">
              $STREAK dias
            </text>

            <!-- RIGHT: TOTAL -->
            <text x="340" y="55" fill="#ffffff" font-size="20" font-weight="bold">
              🏆 Contribuições
            </text>

            <text x="340" y="120" fill="#2ea043" font-size="36" font-weight="bold">
              $TOTAL
            </text>

            <!-- subtítulos -->
            <text x="40" y="150" fill="#8b949e" font-size="11">
              sequência atual de atividade
            </text>

            <text x="340" y="150" fill="#8b949e" font-size="11">
              total de commits registrados
            </text>

          </svg>
          EOF

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add svg/streak.svg
          git commit -m "update split streak svg" || exit 0
          git push
